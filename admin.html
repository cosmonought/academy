<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Neta DAO Academy</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/style.css?v=5" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
    (function () { emailjs.init({ publicKey: "qWT4IiYYkiSwREKOd" }); })();
  </script>
  <style>
    body { background: var(--bg); }
    .admin-wrap {
      max-width: 1100px;
      margin: 86px auto 80px;
      padding: 0 24px;
    }
    .admin-title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .admin-signin {
      background: var(--bg-raised);
      border: 1px solid var(--rule-thin);
      padding: 24px 28px;
      max-width: 480px;
    }
    .admin-signin input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--rule-thin);
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 13px;
      margin-bottom: 10px;
    }
    .admin-signin button {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      padding: 12px 20px;
      background: var(--ink);
      color: var(--bg);
      border: none;
      cursor: pointer;
    }
    .admin-note { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); margin-top: 10px; }

    /* ── Seminar tabs ── */
    .seminar-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--ink); margin-bottom: 24px; flex-wrap: wrap; }
    .seminar-tab {
      font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
      padding: 10px 18px; background: transparent; border: none; border-bottom: 2px solid transparent;
      margin-bottom: -2px; cursor: pointer; color: var(--ink-dim);
    }
    .seminar-tab:hover { color: var(--ink); }
    .seminar-tab.active { color: var(--ink); border-bottom-color: var(--pink); font-weight: 700; }
    .seminar-panel { display: none; }
    .seminar-panel.active { display: block; }
    .seminar-panel h2 {
      font-family: var(--font-display); font-size: 22px; font-weight: 900; text-transform: uppercase;
      margin-top: 40px; margin-bottom: 8px;
    }
    .seminar-panel h2:first-child { margin-top: 0; }

    table.reg-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 16px;
    }
    table.reg-table th, table.reg-table td {
      border: 1px solid var(--rule-thin);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    table.reg-table th {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--bg-raised);
    }
    .status-pill {
      font-family: var(--font-mono);
      font-size: 9px;
      text-transform: uppercase;
      padding: 2px 8px;
      border: 1px solid;
      display: inline-block;
    }
    .status-pill.approved { border-color: #2a8a4a; color: #2a8a4a; }
    .status-pill.pending { border-color: var(--blue); color: var(--blue); }
    .approve-btn {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      padding: 8px 14px;
      background: var(--ink);
      color: var(--bg);
      border: none;
      cursor: pointer;
    }
    .approve-btn:hover { background: #333; }
    .approve-btn:disabled { background: #ccc; cursor: default; }
    .revoke-btn {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      padding: 8px 14px;
      background: transparent;
      color: #a04848;
      border: 1px solid #a04848;
      cursor: pointer;
    }
    .revoke-btn:hover { background: rgba(160,72,72,0.1); }
    .revoke-btn:disabled { color: #ccc; border-color: #ccc; cursor: default; }

    /* ── Session-centric attendance ── */
    .attendance-wrap { margin-top:16px; }
    .attendance-current-label { margin:0 0 10px; color:var(--ink-dim); font:10px var(--font-mono); letter-spacing:.07em; text-transform:uppercase; }
    .attendance-session { border:1px solid var(--rule-thin); margin-bottom:14px; background:var(--bg); }
    .attendance-session > summary {
      cursor:pointer; display:flex; justify-content:space-between; gap:18px; align-items:baseline;
      padding:13px 15px; background:var(--bg-raised); list-style:none;
    }
    .attendance-session > summary::-webkit-details-marker { display:none; }
    .attendance-session-title { font:800 17px var(--font-display); text-transform:uppercase; }
    .attendance-session-meta { color:var(--ink-dim); font:10px var(--font-mono); }
    .attendance-event { padding:16px; border-top:1px solid var(--rule-thin); }
    .attendance-event:first-of-type { border-top:0; }
    .attendance-event-head { display:flex; justify-content:space-between; gap:16px; align-items:end; margin-bottom:10px; }
    .attendance-event-kind { margin:0; font:700 12px var(--font-mono); letter-spacing:.04em; text-transform:uppercase; }
    .attendance-event-title { margin:3px 0 0; font-size:13px; color:var(--ink-mid); }
    .attendance-bulk { border:0; background:transparent; color:var(--blue); cursor:pointer; padding:0; font:10px var(--font-mono); text-decoration:underline; text-underline-offset:3px; }
    .attendance-roster { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border-top:1px solid var(--rule-thin); }
    .attendance-person { display:grid; grid-template-columns:minmax(140px,1fr) auto; gap:14px; align-items:center; min-width:0; padding:9px 0; border-bottom:1px solid var(--rule-thin); }
    .attendance-person:nth-child(odd) { padding-right:14px; border-right:1px solid var(--rule-thin); }
    .attendance-person:nth-child(even) { padding-left:14px; }
    .attendance-person-name { min-width:0; overflow-wrap:anywhere; font:11px var(--font-mono); }
    .attendance-state { display:inline-flex; border:1px solid var(--rule-thin); }
    .attendance-state button { width:31px; min-height:30px; border:0; border-left:1px solid var(--rule-thin); background:transparent; color:var(--ink-dim); cursor:pointer; font:11px var(--font-mono); }
    .attendance-state button:first-child { border-left:0; }
    .attendance-state button.active { background:var(--ink); color:var(--paper); }
    .attendance-state button[data-value="true"].active { background:#2a8a4a; }
    .attendance-state button[data-value="false"].active { background:#8d4646; }
    .attendance-past { margin-top:18px; }
    .attendance-past > summary { cursor:pointer; font:11px var(--font-mono); text-transform:uppercase; letter-spacing:.06em; }
    .attendance-empty { font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); margin-top:16px; }
    @media(max-width:800px) {
      .attendance-roster { grid-template-columns:1fr; }
      .attendance-person:nth-child(odd), .attendance-person:nth-child(even) { padding-inline:0; border-right:0; }
      .attendance-event-head { align-items:start; flex-direction:column; }
    }

    .admin-primary-tabs { display:flex; border-bottom:2px solid var(--ink); margin:0 0 28px; }
    .admin-primary-tab { padding:11px 18px; border:0; border-right:1px solid var(--rule-thin); background:transparent; color:var(--ink-dim); cursor:pointer; font:11px var(--font-mono); text-transform:uppercase; letter-spacing:.06em; }
    .admin-primary-tab.active { background:var(--ink); color:var(--paper); }
    [data-admin-panel][hidden] { display:none !important; }

    .hidden { display: none; }
  </style>
  <script src="/js/site.js?v=9" defer></script>

  <link rel="stylesheet" href="/css/screening-banner.css?v=3">

  <div class="admin-wrap">
    <h1 class="admin-title">Registration Admin</h1>

<div id="adminSignedOut"><p>Sign in with the Academy administrator account.</p><a class="btn btn-primary" href="/account.html?returnTo=%2Fadmin.html">Sign in →</a></div>
    <div id="adminNotAuthorized" class="hidden">
      <p style="font-family:var(--font-mono);font-size:13px;color:#a04848;margin-bottom:14px;">Signed in as <span id="unauthorizedEmail"></span>, but this account isn't authorized to view registrations.</p>
      <a href="#" id="adminSignOutLink" style="font-family:var(--font-mono);font-size:12px;color:var(--blue);text-decoration:underline;">Sign out and try a different email</a>
    </div>

    <div id="adminApproved" class="hidden">
      <div class="admin-primary-tabs" role="tablist" aria-label="Admin sections">
        <button type="button" class="admin-primary-tab active" data-admin-section="seminars" aria-selected="true">Seminars</button>
        <button type="button" class="admin-primary-tab" data-admin-section="inquiries" aria-selected="false">Inquiries</button>
      </div>

      <section id="adminSectionSeminars" data-admin-panel="seminars">
        <div class="seminar-tabs" id="seminarTabs"></div>
        <div id="seminarPanels"></div>
      </section>

      <section id="adminSectionInquiries" data-admin-panel="inquiries" hidden>
      <h2 class="admin-title" style="font-size:22px;margin-top:24px;margin-bottom:8px;">Guest Lecture Proposals</h2>
      <p class="admin-note" id="proposalsStatusLine" style="margin-bottom:16px;"></p>
      <table class="reg-table" id="proposalsTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Proposal</th>
            <th>Submitted</th>
          </tr>
        </thead>
        <tbody id="proposalsTableBody"></tbody>
      </table>

      <h2 class="admin-title" style="font-size:22px;margin-top:40px;margin-bottom:8px;">General Interest Signups</h2>
      <p class="admin-note" id="signupsStatusLine" style="margin-bottom:16px;"></p>
      <button id="signupsRefreshBtn" style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;padding:8px 14px;background:transparent;border:1px solid var(--rule-thin);cursor:pointer;">Refresh Both Lists</button>

      <table class="reg-table" id="signupsTable">
        <thead>
          <tr>
            <th>Name</th>

            <th>Submitted</th>

  <script type="module">
    import {
      auth, onAuthStateChanged, signOut, completeSignInIfNeeded,
      getAllRegistrations, approveRegistration, revokeRegistration, setAttendance,
      getAllInterestSignups, getAllEvaluations, setInstructorEvaluation, ADMIN_EMAIL, SEMINAR_TITLES, ATTENDANCE_EVENTS, attendanceRecord, EVALUATION_FORMS, EVALUATION_OUTCOMES
    } from '/js/academy-auth.js?v=25';

    const adminSignedOut     = document.getElementById('adminSignedOut');
    const adminNotAuthorized = document.getElementById('adminNotAuthorized');
    const adminApproved      = document.getElementById('adminApproved');

    function showAdminState(el) {
      [adminSignedOut, adminNotAuthorized, adminApproved].forEach(s => s.classList.add('hidden'));
      el.classList.remove('hidden');
    }

    function isApproved(val) {
      return val === true || val === 'true';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }


    document.getElementById('adminApproved').addEventListener('click', event => {
      const tab = event.target.closest('[data-admin-section]');
      if (!tab) return;
      const section = tab.dataset.adminSection;
      document.querySelectorAll('[data-admin-section]').forEach(button => {
        const active = button.dataset.adminSection === section;
        button.classList.toggle('active', active);
        button.setAttribute('aria-selected', String(active));
      });
      document.querySelectorAll('[data-admin-panel]').forEach(panel => {
        panel.hidden = panel.dataset.adminPanel !== section;
      });
    });

    const SEMINAR_IDS = Object.keys(SEMINAR_TITLES);
    let activeSeminar = SEMINAR_IDS[0];
    let allEvaluations = {};
    let allRegistrationsFlat = []; // [{ emailKey, seminarId, reg }]

    // ── Build tabs + panel shells once ──
    function buildTabsAndPanels() {
      const tabsEl = document.getElementById('seminarTabs');
      const panelsEl = document.getElementById('seminarPanels');
      tabsEl.innerHTML = '';
      panelsEl.innerHTML = '';

      SEMINAR_IDS.forEach((seminarId, i) => {
        const tab = document.createElement('button');
        tab.className = 'seminar-tab' + (i === 0 ? ' active' : '');
        tab.textContent = SEMINAR_TITLES[seminarId];
        tab.addEventListener('click', () => switchSeminar(seminarId));
        tabsEl.appendChild(tab);

        const panel = document.createElement('div');
        panel.className = 'seminar-panel' + (i === 0 ? ' active' : '');
        panel.id = `panel-${seminarId}`;
        panel.innerHTML = `
          <h2>Registrations</h2>
          <p class="admin-note" id="statusLine-${seminarId}"></p>
          <table class="reg-table" id="regTable-${seminarId}">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>X Handle</th>
                <th>Reason for Joining</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="regTableBody-${seminarId}"></tbody>
          </table>

          <h2>Attendance</h2>
          <div class="attendance-wrap" id="attendanceWrap-${seminarId}"></div>
          <h2>Optional evaluation</h2><div id="evaluationWrap-${seminarId}"></div>
        `;
        panelsEl.appendChild(panel);
      });
    }

    function switchSeminar(seminarId) {
      activeSeminar = seminarId;
      document.querySelectorAll('.seminar-tab').forEach((t, i) => {
        t.classList.toggle('active', SEMINAR_IDS[i] === seminarId);
      });
      document.querySelectorAll('.seminar-panel').forEach(p => {
        p.classList.toggle('active', p.id === `panel-${seminarId}`);
      });
    }

    async function loadRegistrations() {
      const all = await getAllRegistrations();
      try { allEvaluations = await getAllEvaluations(); } catch (error) { console.error("Could not load evaluations", error); allEvaluations = {}; }

      if (!all) {
        SEMINAR_IDS.forEach(id => {
          document.getElementById(`statusLine-${id}`).textContent = 'Could not load registrations — check console for errors.';
        });
        return;
      }

      allRegistrationsFlat = [];
      for (const [emailKey, seminars] of Object.entries(all)) {
        if (!seminars || typeof seminars !== 'object') continue;
        for (const [seminarId, reg] of Object.entries(seminars)) {
          allRegistrationsFlat.push({ emailKey, seminarId, reg });
        }
      }

      SEMINAR_IDS.forEach(renderSeminarSection);
    }

    function renderSeminarSection(seminarId) {
      const rows = allRegistrationsFlat.filter(r => r.seminarId === seminarId);
      rows.sort((a, b) => (b.reg.requestedAt || 0) - (a.reg.requestedAt || 0));

      const enrolledCount = rows.filter(r => isApproved(r.reg.enrolled)).length;
      document.getElementById(`statusLine-${seminarId}`).textContent =
        `${rows.length} total registration(s) — ${enrolledCount} enrolled.`;

      // ── Registration table ──
      const tbody = document.getElementById(`regTableBody-${seminarId}`);
      tbody.innerHTML = '';
      for (const { emailKey, reg } of rows) {
        const approved = isApproved(reg.enrolled);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(reg.name || '')}</td>
          <td>${escapeHtml(reg.email || '')}</td>
          <td>${escapeHtml(reg.xHandle || '')}</td>
          <td>${escapeHtml(reg.reason || '—')}</td>
          <td><span class="status-pill ${approved ? 'approved' : 'pending'}">${approved ? 'Enrolled' : 'Pending'}</span></td>
          <td></td>
        `;
        const actionCell = tr.lastElementChild;
        if (approved) {
          const btn = document.createElement('button');
          btn.className = 'revoke-btn';
          btn.textContent = 'Revoke';
          btn.addEventListener('click', async () => {
            if (!confirm(`Revoke access for ${reg.name || reg.email}? They will lose readings and screening access immediately.`)) return;
            btn.disabled = true;
            btn.textContent = 'Revoking…';
            await revokeRegistration(emailKey, seminarId);
            loadRegistrations();
          });
          actionCell.appendChild(btn);
        } else {
          const btn = document.createElement('button');
          btn.className = 'approve-btn';
          btn.textContent = 'Approve';
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.textContent = 'Approving…';
            await approveRegistration(emailKey, seminarId, reg.email, reg.name, SEMINAR_TITLES[seminarId] || seminarId);
            loadRegistrations();
          });
          actionCell.appendChild(btn);
        }
        tbody.appendChild(tr);
      }

      // ── Session-centric attendance (enrolled participants only) ──
      const wrap = document.getElementById(`attendanceWrap-${seminarId}`);
      const enrolledRows = rows.filter(r => isApproved(r.reg.enrolled));
      const events = ATTENDANCE_EVENTS[seminarId] || [];

      if (enrolledRows.length === 0) {
        wrap.innerHTML = '<p class="attendance-empty">No enrolled participants yet.</p>';
        renderEvaluations(seminarId, enrolledRows);
        return;
      }
      if (events.length === 0) {
        wrap.innerHTML = '<p class="attendance-empty">No attendance events are scheduled for this seminar yet.</p>';
        renderEvaluations(seminarId, enrolledRows);
        return;
      }

      const groups = [];
      for (const event of events) {
        let group = groups.find(item => item.parent === event.parent);
        if (!group) {
          group = { parent:event.parent, events:[] };
          groups.push(group);
        }
        group.events.push(event);
      }
      const today = new Date().toISOString().slice(0,10);
      const datedGroups = groups.map(group => ({
        group,
        nextDate: group.events.map(event => event.date).filter(Boolean).sort().find(date => date >= today) || null,
        lastDate: group.events.map(event => event.date).filter(Boolean).sort().at(-1) || null
      }));
      const activeGroup = datedGroups.filter(item => item.nextDate).sort((a,b) => a.nextDate.localeCompare(b.nextDate))[0]?.group
        || datedGroups.filter(item => item.lastDate).sort((a,b) => (b.lastDate || '').localeCompare(a.lastDate || ''))[0]?.group
        || groups.at(-1);

      function groupTitle(group) {
        const lecture = group.events.find(event => event.type === 'lecture');
        const numeric = /^s(\d+)$/.exec(group.parent || '');
        const prefix = numeric ? `Session ${numeric[1]}` : (group.events[0]?.label || group.parent);
        return lecture ? `${prefix} — ${lecture.label}` : prefix;
      }

      function attendanceValue(reg, eventKey) {
        const value = reg.attendance?.[eventKey];
        return value === true ? 'true' : value === false ? 'false' : 'null';
      }

      function makeStateControl(row, event) {
        const control = document.createElement('span');
        control.className = 'attendance-state';
        control.setAttribute('role','group');
        control.setAttribute('aria-label', `${row.reg.name || row.reg.email}: ${event.type} ${event.label}`);
        const options = [
          ['true','✓','Attended',true],
          ['false','—','Absent',false],
          ['null','?','Unrecorded',null]
        ];
        for (const [value,symbol,label,storedValue] of options) {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.value = value;
          button.textContent = symbol;
          button.title = label;
          button.setAttribute('aria-label',label);
          button.classList.toggle('active', attendanceValue(row.reg,event.key) === value);
          button.addEventListener('click', async () => {
            [...control.querySelectorAll('button')].forEach(item => item.disabled = true);
            try {
              await setAttendance(row.emailKey, seminarId, event.key, storedValue);
              row.reg.attendance ||= {};
              if (storedValue === null) delete row.reg.attendance[event.key];
              else row.reg.attendance[event.key] = storedValue;
              control.querySelectorAll('button').forEach(item => item.classList.toggle('active', item.dataset.value === value));
            } catch {
              alert('Attendance could not be saved.');
            } finally {
              [...control.querySelectorAll('button')].forEach(item => item.disabled = false);
            }
          });
          control.append(button);
        }
        return control;
      }

      function renderEvent(event) {
        const section = document.createElement('section');
        section.className = 'attendance-event';
        const head = document.createElement('div');
        head.className = 'attendance-event-head';
        const title = document.createElement('div');
        title.innerHTML = `<p class="attendance-event-kind">${escapeHtml(event.type)}</p><p class="attendance-event-title">${escapeHtml(event.label)}${event.date ? ' · ' + escapeHtml(event.date) : ''}</p>`;
        const bulk = document.createElement('button');
        bulk.type = 'button';
        bulk.className = 'attendance-bulk';
        bulk.textContent = 'Mark all attended';
        bulk.addEventListener('click', async () => {
          if (!confirm(`Mark every enrolled participant attended for ${event.label}?`)) return;
          bulk.disabled = true;
          try {
            await Promise.all(enrolledRows.map(row => setAttendance(row.emailKey, seminarId, event.key, true)));
            enrolledRows.forEach(row => { row.reg.attendance ||= {}; row.reg.attendance[event.key] = true; });
            [...section.querySelectorAll('.attendance-state')].forEach(control => {
              control.querySelectorAll('button').forEach(button => button.classList.toggle('active', button.dataset.value === 'true'));
            });
          } catch {
            alert('Some attendance marks could not be saved. Reload before continuing.');
          } finally { bulk.disabled = false; }
        });
        head.append(title,bulk);
        section.append(head);

        const roster = document.createElement('div');
        roster.className = 'attendance-roster';
        for (const row of enrolledRows) {
          const person = document.createElement('div');
          person.className = 'attendance-person';
          const name = document.createElement('span');
          name.className = 'attendance-person-name';
          name.textContent = row.reg.name || row.reg.email || '(unknown)';
          person.append(name, makeStateControl(row,event));
          roster.append(person);
        }
        section.append(roster);
        return section;
      }

      function renderGroup(group, open, currentLabel = false) {
        const details = document.createElement('details');
        details.className = 'attendance-session';
        details.open = open;
        const summary = document.createElement('summary');
        const count = group.events.length;
        summary.innerHTML = `<span class="attendance-session-title">${escapeHtml(groupTitle(group))}</span><span class="attendance-session-meta">${count} event${count === 1 ? '' : 's'}</span>`;
        details.append(summary);
        group.events.forEach(event => details.append(renderEvent(event)));
        if (currentLabel) {
          const label = document.createElement('p');
          label.className = 'attendance-current-label';
          label.textContent = 'Current / next session';
          wrap.append(label);
        }
        return details;
      }

      wrap.replaceChildren();
      if (activeGroup) wrap.append(renderGroup(activeGroup, true, true));
      const remaining = groups.filter(group => group !== activeGroup);
      if (remaining.length) {
        const past = document.createElement('details');
        past.className = 'attendance-past';
        const summary = document.createElement('summary');
        summary.textContent = 'Past / other sessions';
        past.append(summary);
        remaining.forEach(group => past.append(renderGroup(group,false)));
        wrap.append(past);
      }
      renderEvaluations(seminarId, enrolledRows);
    }

    function renderEvaluations(seminarId, rows) {
      const wrap = document.getElementById(`evaluationWrap-${seminarId}`);
      wrap.replaceChildren();
      if (seminarId !== 'sex-monsters-superheroes') {
        wrap.textContent = 'Evaluation is not configured for this seminar.';
        return;
      }
      for (const { emailKey, reg } of rows) {
        const evaluation = allEvaluations[emailKey]?.[seminarId] || {};
        if (!evaluation.request && !evaluation.instructor) continue;
        const form = document.createElement('form');
        form.style.cssText = 'border-top:1px solid var(--rule-thin); padding:14px 0; display:flex; flex-wrap:wrap; gap:10px; align-items:end;';
        form.innerHTML = `<strong>${escapeHtml(reg.name || reg.email)}</strong><span>${escapeHtml(reg.email)}</span><span>Requested: ${escapeHtml(EVALUATION_FORMS[evaluation.request?.form] || '—')}</span>
          <label>State <select name="state"><option value="agreed">Agreed / in progress</option><option value="completed">Completed</option></select></label>
          <label>Agreed form <select name="form">${Object.entries(EVALUATION_FORMS).map(([key,label]) => `<option value="${key}">${escapeHtml(label)}</option>`).join('')}</select></label>
          <label>Outcome <select name="outcome"><option value="">Pending</option>${Object.entries(EVALUATION_OUTCOMES).map(([key,label]) => `<option value="${key}">${escapeHtml(label)}</option>`).join('')}</select></label>
          <label>Instructor feedback <textarea name="feedback" rows="3" style="width:min(430px,80vw)"></textarea></label><button type="submit">Save evaluation</button><span role="status"></span>`;
        form.elements.state.value = evaluation.instructor?.state || 'agreed';
        form.elements.namedItem('form').value = evaluation.instructor?.form || evaluation.request?.form || 'other';
        form.elements.outcome.value = evaluation.instructor?.outcome || '';
        form.elements.feedback.value = evaluation.instructor?.feedback || '';
        form.addEventListener('submit', async event => {
          event.preventDefault(); const status = form.querySelector('[role="status"]');
          const state = form.elements.namedItem('state'); const workForm = form.elements.namedItem('form');
          const outcome = form.elements.namedItem('outcome'); const feedback = form.elements.namedItem('feedback');
          if (state.value === 'completed' && !outcome.value) { status.textContent = 'Choose an outcome for completed work.'; return; }
          const record = { state: state.value, form: workForm.value, feedback: feedback.value };
          if (state.value === 'completed') record.outcome = outcome.value;
          try { await setInstructorEvaluation(emailKey, seminarId, record); status.textContent = 'Saved.'; }
          catch { status.textContent = 'Could not save evaluation.'; }
        });
        wrap.append(form);
      }
      if (!wrap.children.length) wrap.textContent = 'No evaluation requests yet.';
    }

    async function loadInterestSignups() {
      const all = await getAllInterestSignups();
      const signupsTbody = document.getElementById('signupsTableBody');
      const proposalsTbody = document.getElementById('proposalsTableBody');
      signupsTbody.innerHTML = '';
      proposalsTbody.innerHTML = '';

      if (!all) {
        document.getElementById('signupsStatusLine').textContent = 'Could not load signups — check console for errors.';
        document.getElementById('proposalsStatusLine').textContent = 'Could not load proposals — check console for errors.';
        return;
      }

      const entries = Object.entries(all).sort((a, b) => (b[1].submittedAt || 0) - (a[1].submittedAt || 0));
      const proposals = entries.filter(([, s]) => s.proposingLecture);
      const signups = entries.filter(([, s]) => !s.proposingLecture);

      document.getElementById('proposalsStatusLine').textContent = `${proposals.length} guest lecture proposal(s).`;
      document.getElementById('signupsStatusLine').textContent = `${signups.length} general signup(s).`;

      for (const [, signup] of proposals) {
        const tr = document.createElement('tr');
        const submittedDate = signup.submittedAt ? new Date(signup.submittedAt).toLocaleString() : '';
        tr.innerHTML = `
          <td>${escapeHtml(signup.name || '')}</td>
          <td>${escapeHtml(signup.email || '')}</td>
          <td>${escapeHtml(signup.proposal || '(no details given)')}</td>
          <td>${escapeHtml(submittedDate)}</td>
        `;
        proposalsTbody.appendChild(tr);
      }

      for (const [, signup] of signups) {
        const tr = document.createElement('tr');
        const submittedDate = signup.submittedAt ? new Date(signup.submittedAt).toLocaleString() : '';
        tr.innerHTML = `
          <td>${escapeHtml(signup.name || '')}</td>
          <td>${escapeHtml(signup.email || '')}</td>
          <td>${escapeHtml(submittedDate)}</td>
        `;
        signupsTbody.appendChild(tr);
      }
    }

    (async () => {
      await completeSignInIfNeeded();
      onAuthStateChanged(auth, async (user) => {
        if (!user) { showAdminState(adminSignedOut); return; }
        if (!user.email) {
          console.log('Auth state fired without an email yet — waiting for the next update.');
          return;
        }
        if (user.email !== ADMIN_EMAIL || !user.emailVerified) {
          document.getElementById('unauthorizedEmail').textContent = user.email || '(unknown)';
          showAdminState(adminNotAuthorized);
          return;
        }
        showAdminState(adminApproved);
        buildTabsAndPanels();
        loadRegistrations();
        loadInterestSignups();
      });
    })();

    document.getElementById('adminSignOutLink').addEventListener('click', (e) => {
      e.preventDefault();
      signOut(auth);
    });

    document.getElementById('signupsRefreshBtn').addEventListener('click', loadInterestSignups);
  </script>
</body>
</html>
